[build]
  command   = "echo 'No build step'"
  publish   = "."

[functions]
  directory       = "netlify/functions"
  node_bundler    = "esbuild"
  included_files  = ["netlify/functions/dates_mapping.json"]

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[dev]
  port = 8888
